<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/32.png" alt="" width="20" height="20">
    <strong>Haul</strong>
    <span id="status" class="pill">…</span>
  </header>

  <label class="row">
    <span>Send downloads to Haul</span>
    <input type="checkbox" id="capture">
  </label>

  <label class="row">
    <span>Download button on videos</span>
    <input type="checkbox" id="videoButton">
  </label>

  <button id="grab" class="primary">Download video from this page</button>

  <section>
    <h2>Media found on this page</h2>
    <ul id="media"></ul>
    <p id="empty" class="muted">Nothing yet. Play the video, then open this again.</p>
  </section>

  <p id="help" class="muted" hidden>
    Haul isn't connected. Open Haul, go to <b>Settings → Browser</b> and press <b>Set up</b>,
    then restart the browser.
  </p>
  <p id="msg" class="muted"></p>
  <script src="popup.js"></script>
</body>
</html>
